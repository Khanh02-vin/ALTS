name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # Everything here takes ~6 min normally; the one slow step is apt (a PR run once
    # spent 41 min in apt-get on a congested mirror). A hung job should fail and be
    # re-run, not sit for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Key material must never reach the repository. .gitignore already covers
      # keys/ and *.pem, but `git add -f` bypasses ignore rules silently; this
      # fails the build if anything key-shaped is actually tracked.
      - name: Guard against committed key material
        run: |
          tracked=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|jks)$|(^|/)id_(rsa|ed25519)$|credentials\.json$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::key material is tracked by git:" >&2
            echo "$tracked" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Repo root IS the project (package.json sits at root on GitHub), so no
      # working-directory prefix — the previous value pointed at a folder that
      # does not exist in the repository and made every CI run fail.
      - name: Install system deps (ffmpeg for media tests, webkit for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      # The Node-side render tests drive the Rust render engine through its CLI, so the
      # engine binary has to exist before `npm test` runs. It is a separate crate, so it
      # builds without the web frontend.
      - name: Build the render engine CLI
        run: cargo build -p lfai-render
        working-directory: apps/desktop/src-tauri
      - run: npm test
      # tauri-build validates bundle.resources at compile time; the real binaries are
      # git-ignored, so create the paths (placeholders are never executed by tests).
      - run: LIGHTWEIGHT=1 bash scripts/fetch-bundled-assets.sh
      # tauri::generate_context! embeds frontendDist (../../web/build) at compile time.
      - name: Build web frontend (generate_context needs frontendDist)
        run: |
          cd apps/web
          npm ci
          npm run build
          npm run build:node
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      # `npm audit` at the repo root has no lockfile (each workspace has its own),
      # so the old step failed with ENOLOCK and `continue-on-error` hid it — it
      # audited nothing. Audit the real lockfiles instead: production deps must be
      # clean; dev-only advisories (build tooling like vite/launch-editor) are
      # reported but do not block, since they never ship in the app bundle.
      - name: Audit production dependencies
        run: |
          set -euo pipefail
          for dir in apps/web apps/desktop; do
            echo "== $dir (production) =="
            ( cd "$dir" && npm audit --omit=dev --audit-level=high )
          done
      - name: Report dev-only advisories
        continue-on-error: true
        run: |
          for dir in apps/web apps/desktop; do
            echo "== $dir (all deps) =="
            ( cd "$dir" && npm audit --audit-level=high ) || true
          done
      # ai-engine pins `ort` to an exact release candidate because 2.x has no stable
      # release yet (1.x is an incompatible API line). This records when a stable
      # 2.0.0 finally ships so the pin can be lifted deliberately instead of being
      # rediscovered by an audit months later. Informational: never fails the build.
      - name: Note when ort ships a stable 2.x
        continue-on-error: true
        run: |
          latest=$(curl -fsS --max-time 30 https://crates.io/api/v1/crates/ort \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['crate']['max_stable_version'])")
          echo "ort latest stable-looking version: ${latest:-unknown}"
          pinned=$(grep -oE 'ort = \{ version = "=[0-9a-zA-Z.\-]+"' apps/desktop/src-tauri/crates/ai-engine/Cargo.toml | head -1)
          echo "pinned: ${pinned}"
          case "$latest" in
            *-rc*|*"") echo "::notice::ort is still pre-release; keep the exact pin" ;;
            *) echo "::warning::ort ${latest} is stable — revisit the =2.0.0-rc.15 pin" ;;
          esac

  # The hardening work (ADR-004) added cfg(windows) code paths — Job Object spawn,
  # taskkill/tasklist worker control, %APPDATA% state layout — that only compile on a
  # Windows host. The ffmpeg-driven tests skip themselves there (runners have no
  # ffmpeg); everything else runs, which is what makes a typo in those paths fail CI
  # instead of breaking the next Windows release build.
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch bundled resources (placeholders are enough for cargo test)
        shell: bash
        run: LIGHTWEIGHT=1 bash scripts/fetch-bundled-assets.sh
      - name: Build web frontend (generate_context needs frontendDist)
        shell: bash
        run: |
          cd apps/web
          npm ci
          npm run build
          npm run build:node
      - name: cargo test on Windows
        run: cargo test
        working-directory: apps/desktop/src-tauri
